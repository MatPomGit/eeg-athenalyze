name: Muse Athena adapter tests
on:
  pull_request:
    paths:
      - "src/eeg_athenalyze/muse_athena.py"
      - "src/eeg_athenalyze/cli.py"
      - "tests/test_muse*.py"
      - "pyproject.toml"
      - ".github/workflows/muse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-hardware:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional BrainFlow stack
        run: python -m pip install ".[muse]"
      - name: Verify BrainFlow driver and mock tests
        run: python -m unittest discover -s tests -v
      - name: Show Athena board layout
        run: python -m eeg_athenalyze devices check --device muse-athena
