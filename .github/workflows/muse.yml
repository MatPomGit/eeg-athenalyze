name: Muse Athena adapter tests
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  mock-hardware:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional BrainFlow stack
        run: python -m pip install ".[muse]"
      - name: Verify BrainFlow driver and mock tests
        run: python -m unittest discover -s tests -v
      - name: Show Athena board layout
        run: python -m eeg_athenalyze devices check --device muse-athena
