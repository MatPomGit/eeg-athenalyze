name: EEGZ plot tests

on:
  pull_request:
    paths:
      - "src/eeg_athenalyze/visualization.py"
      - "src/eeg_athenalyze/cli.py"
      - "tests/test_visualization.py"
      - "pyproject.toml"
      - ".github/workflows/eegz-plot-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/eeg_athenalyze/visualization.py"
      - "src/eeg_athenalyze/cli.py"
      - "tests/test_visualization.py"
      - "pyproject.toml"
      - ".github/workflows/eegz-plot-tests.yml"

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting extra
        run: python -m pip install -e ".[plot]"
      - name: Render trace PSD and spectrogram tests
        run: python -m unittest discover -s tests -p test_visualization.py -v
