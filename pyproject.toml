[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-athenalyze"
version = "0.1.0"
description = "EEG acquisition, preprocessing, and analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
bids = ["numpy>=1.26,<3", "mne>=1.9,<2", "mne-bids>=0.17,<1", "pybv>=0.7,<1", "bids-validator-deno>=3.0,<4"]

muse = ["brainflow>=5.22,<6", "numpy>=1.26,<3"]

[project.scripts]
eeg-athenalyze = "eeg_athenalyze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
