[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-athenalyze"
version = "0.1.0"
description = "EEG acquisition, preprocessing, and analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
eeg-athenalyze = "eeg_athenalyze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
